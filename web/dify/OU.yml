    - data:
        code: |
          import json
          import re


          ALLOWED_TYPES = ("listen_choose_image", "tap_to_read", "read_choose", "cloze")


          def extract(text: str) -> dict:
              t = text.strip()
              m = re.search(r"```(?:json)?\s*(.*?)```", t, re.S)
              if m:
                  t = m.group(1).strip()
              s = t.find("{")
              e = t.rfind("}")
              if s == -1 or e == -1:
                  raise ValueError("未找到 JSON 对象")
              t = t[s:e + 1]
              try:
                  return json.loads(t)
              except json.JSONDecodeError:
                  fixed = re.sub(r",\s*([\]}])", r"\1", t)
                  return json.loads(fixed)


          def normalize_question(q: dict, unit_id: str, idx: int) -> dict:
              qtype = str(q.get("type") or "").strip()
              if qtype not in ALLOWED_TYPES:
                  raise ValueError("非法题型: " + qtype)
              opts = q.get("options")
              if not isinstance(opts, list) or not opts:
                  raise ValueError("题目缺少 options")
              norm_opts = []
              for o in opts:
                  if not isinstance(o, dict):
                      continue
                  norm_opts.append({
                      "id": str(o.get("id") or chr(97 + len(norm_opts))),
                      "imagePrompt": str(o.get("imagePrompt") or ""),
                      "text": str(o.get("text") or ""),
                      "correct": bool(o.get("correct")),
                  })
              if sum(1 for o in norm_opts if o["correct"]) != 1:
                  raise ValueError("题目必须恰好一个正确选项: " + str(q.get("id")))
              return {
                  "id": unit_id + "-q" + str(idx),
                  "type": qtype,
                  "promptZh": str(q.get("promptZh") or ""),
                  "audioText": str(q.get("audioText") or ""),
                  "options": norm_opts,
              }


          def main(text: str, unit_id: str, word_count: int) -> dict:
              data = extract(text)
              qs = data.get("questions")
              if not isinstance(qs, list) or not qs:
                  raise ValueError("缺少 questions")
              questions = []
              for i, q in enumerate(qs):
                  if isinstance(q, dict):
                      questions.append(normalize_question(q, unit_id, i + 1))
              if not questions:
                  raise ValueError("没有可用题目")
              content = {
                  "unitId": unit_id,
                  "level": str(data.get("level") or ""),
                  "topic": str(data.get("topic") or ""),
                  "titleZh": str(data.get("titleZh") or ""),
                  "wordCount": int(word_count or len(questions)),
                  "estMinutes": int(data.get("estMinutes") or max(3, len(questions))),
                  "questions": questions,
              }
              return {"content": json.dumps(content, ensure_ascii=False), "question_count": len(questions)}

