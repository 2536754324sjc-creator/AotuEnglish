    - data:
        context:
          enabled: false
          variable_selector: []
        desc: ''
        memory:
          enabled: false
          window:
            enabled: false
            size: 50
        model:
          completion_params:
            max_tokens: 4096
            temperature: 0.3
            thinking: false
            top_p: 0.9
          mode: chat
          name: glm-4.5-flash
          provider: langgenius/zhipuai/zhipuai
        prompt_template:
        - role: system
          text: "你是资深的少儿与成人英语课程架构师，为 AotuEnglish 学习网站规划课程框架。\n\n【输入参数】\n\
            - level：内容档，取值 kids-a / kids-b / teen / adult\n- topic：课程主题，例如 \"farm animals\"\n\
            - units：期望单元数（可选，空则按档位默认）\n- goals：学习目标（可选，可能为空）\n\n\
            【内容档定义】\n- kids-a（4-7 岁）：大图少字，每单元 6-8 个词，无长句，纯听说\n- kids-b（7-12 岁）：可含短句，每单元\
            \ 8-12 个词，可含简单阅读\n- teen（13-16 岁）：文字为主，可含长句与语法点，每单元 10-15 个词\n\
            - adult（17+）：信息密集，可含商务场景与复杂句式，每单元 12-20 个词\n\n【任务】\n规划课程框架，只输出框架，不输出任何具体词汇、题目或例句。\n\
            \n【输出格式】\n只输出一个 JSON 对象，不得包含解释、前后缀或 Markdown 代码块标记：\n{\n  \"courseName\"\
            : \"课程名称（中文）\",\n  \"description\": \"课程简介（中文，80字以内）\",\n  \"units\"\
            : [\n    {\n      \"unitId\": \"kids-a-farm-01\",\n      \"titleZh\": \"农场动物\"\
            ,\n      \"topic\": \"Farm Animals\",\n      \"wordCount\": 8,\n      \"estMinutes\"\
            : 5,\n      \"words\": [\"cow\", \"duck\", \"pig\", \"horse\", \"sheep\", \"hen\"\
            , \"goat\", \"cat\"],\n      \"distractors\": [\"car\", \"table\", \"apple\"\
            , \"pencil\", \"chair\", \"bottle\", \"window\", \"shoe\"]\n    }\n  ]\n\
            }\n\n【硬性规则】\n1. unitId 格式：{level}-{topic英文小写短横线}-{两位序号}，例如 kids-a-farm-01。\n\
            2. words 数量必须等于 wordCount，且全部是英语单词（1-2 个词的小词组可以，如 ice cream）。\n\
            3. distractors 是「干扰词」：必须与 words 同档难度、但明显不属于本单元主题，数量与 words\
            \ 相同。用来生成错误选项，不能与 words 重复。\n4. units 数量：kids-a 默认 5，kids-b 默认\
            \ 6，teen 默认 6，adult 默认 8；传入 units 时以传入为准。\n5. 所有单元之间主题不重复，难度递进。\n\
            6. 每个字符串值写成一行，值内禁止英文双引号与英文单引号，需要引用时用中文引号「」。\n7. 你的输出会被程序解析，必须是完整合法的\
            \ JSON。"
