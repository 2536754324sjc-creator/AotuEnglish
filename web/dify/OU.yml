    nodes:
    - data:
        code: "import json\n\n\ndef main(units_result: list, course_name: str, description: str, level: str) -> dict:\n    ok, failed = [], []\n    for u in units_result or []:\n        if isinstance(u, dict) and isinstance(u.get(\"content\"), dict):\n            ok.append(u)\n        else:\n            failed.append(str(u)[:60])\n\n    passed = sum(1 for u in ok if u.get(\"reviewStatus\") == \"pass\")\n    repaired = len(ok) - passed\n    if ok and not failed and repaired == 0:\n        review_status = \"pass\"\n    elif ok:\n        review_status = \"partial\"\n    else:\n        review_status = \"fail\"\n\n    units = []\n    for u in ok:\n        c = u.get(\"content\") or {}\n        qs = c.get(\"questions\") or []\n        units.append({\n            \"unitId\": c.get(\"unitId\") or u.get(\"unitId\", \"\"),\n            \"level\": c.get(\"level\") or level,\n            \"topic\": c.get(\"topic\", \"\"),\n            \"titleZh\": c.get(\"titleZh\") or u.get(\"titleZh\", \"\"),\n            \"wordCount\": c.get(\"wordCount\", 0),\n            \"estMinutes\": c.get(\"estMinutes\", 5),\n            \"reviewStatus\": u.get(\"reviewStatus\", \"\"),\n            \"questionCount\": len(qs),\n            \"questions\": qs,\n        })\n\n    course = {\n        \"courseName\": course_name,\n        \"description\": description,\n        \"level\": level,\n        \"reviewStatus\": review_status,\n        \"units\": units,\n    }\n\n    total_q = sum(u[\"questionCount\"] for u in units)\n    by_type = {}\n    for u in units:\n        for q in u[\"questions\"]:\n            t = q.get(\"type\", \"unknown\")\n            by_type[t] = by_type.get(t, 0) + 1\n    stats = \"单元 %d（一次通过 %d，修复后 %d），失败 %d；题目共 %d；题型分布 %s\" % (\n        len(units), passed, repaired, len(failed), total_q,\n        \", \".join(\"%s=%d\" % (k, v) for k, v in sorted(by_type.items())),\n    )\n\n    # 前端直用：一个 JSON，含全部单元\n    lesson_json = json.dumps(course, ensure_ascii=False)\n\n    # 逐单元拆分，方便单独入库\n    units_json = json.dumps({\"units\": units}, ensure_ascii=False)\n\n    # 质量提示：列出需要人工看一眼的地方\n    warnings = []\n    for u in units:\n        if u[\"reviewStatus\"] != \"pass\":\n            warnings.append(\"单元 %s 经过修复，建议抽查\" % u[\"unitId\"])\n        if u[\"questionCount\"] < 6:\n            warnings.append(\"单元 %s 题目偏少（%d 题）\" % (u[\"unitId\"], u[\"questionCount\"]))\n    if failed:\n        warnings.append(\"失败单元 %d 个：%s\" % (len(failed), \"; \".join(failed)))\n\n    return {\n        \"course\": json.dumps(course, ensure_ascii=False),\n        \"lesson_json\": lesson_json,\n        \"units_json\": units_json,\n        \"stats\": stats,\n        \"warnings\": \"；\".join(warnings) if warnings else \"无\",\n    }\n"
        code_language: python3
