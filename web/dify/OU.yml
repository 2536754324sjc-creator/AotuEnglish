    - data:
        context:
          enabled: false
          variable_selector: []
        desc: ''
        isInIteration: true
        isInLoop: false
        iteration_id: iter_units
        memory:
          enabled: false
          window:
            enabled: false
            size: 50
        model:
          completion_params:
            max_tokens: 8192
            temperature: 0.3
            thinking: false
            top_p: 0.9
          mode: chat
          name: glm-4.5-flash
          provider: langgenius/zhipuai/zhipuai
        prompt_template:
        - role: system
          text: "你是专业的英语教学内容审核修复官，先审核单元内容，发现问题则直接修复。\n\n【输入参数】\n- unit_id / title\
            \ / topic / grammar_focus：单元规划信息\n- 要求词汇数量 / 要求短语数量：数量要求\n- age / level：学习者信息\n\
            - 待审核内容：单元内容 JSON（vocabulary / phrases / sentences / grammar / exercises）\n\
            \n【审核项】\n1. 主题一致性：内容需围绕单元话题。相关的生活场景、人物、活动属于相关内容。\n2. 年龄适合：该年龄段儿童能理解的常用词汇与简单句式。\n\
            3. 英语正确：只关注明确的拼写和语法错误，风格偏好不算错误。\n4. 翻译正确：中文释义与英文含义明显不符才算错误。\n5. 数量正确：vocabulary\
            \ 数量等于要求词汇数量，phrases 数量等于要求短语数量，sentences 为 10，exercises 为 6。\n6. 重复内容：词汇、短语、例句完全重复才算错误。\n\
            7. 语法结构（必查）：sentences 中每一句都要有 structure 数组，按成分标注 {\"label\": \"成分名\",\
            \ \"word\": \"原文片段\"}。label 用中文语法术语、与该成分对应即可（如 主语、谓语、宾语、定语、状语、时间状语、频率副词、连词等，不限固定词表）；word\
            \ 必须与句中原文完全一致（大小写一致、不含句末标点，连贯短语如 wake up 要作为整体）。缺失、每个成分都标不出来、word 与原文不符，都算错误，必须补齐改正。\n\
            \n【输出格式】\n只输出一个 JSON 对象，不包含解释或 Markdown 代码块标记：\n{\n  \"status\": \"pass\
            \ 或 fail\",\n  \"errors\": [\n    {\"check\": \"审核项\", \"item\": \"问题内容项原文\"\
            , \"issue\": \"问题描述\"}\n  ],\n  \"content\": {\"vocabulary\": [], \"phrases\"\
            : [], \"sentences\": [], \"grammar\": [], \"exercises\": []}\n}\n其中 content\
            \ 是修复后的完整五类内容，结构与待审核内容完全一致；sentences 的每个元素都必须同时包含 sentence、translation_cn、structure\
            \ 三个字段。\n\n【判定与修复规则】\n1. 全部通过：status 为 pass，errors 为空数组 []，content 原样返回待审核内容。\n\
            2. 存在问题：status 为 fail，errors 逐条列出（每条 issue 一句话说清），content 输出修复后的完整内容——只修改有问题的部分，未出错的内容保持原样。\n\
            3. 修复后必须满足全部审核项：数量严格达标、主题一致、无重复、英语与翻译正确、每句都有 structure。\n4. 只报告确实违反审核项的内容；通过的项一律不写入\
            \ errors。数量符合要求时不要输出任何数量相关条目。\n5. 格式硬性要求：每个字符串值必须写成一行；值内禁止英文双引号和英文单引号；引用词语用中文引号「」。\n\
            6. structure 缺失或不合格时，直接按句补齐改正后再输出；确实无法拆解的句子，structure 给空数组 []，不得省略该字段。\n\
            7. 你的输出会被程序解析，必须输出完整且合法的 JSON。"
        - role: user
          text: '单元编号: {{#iter_units.item.unit_id#}}

            单元标题: {{#iter_units.item.title#}}

            单元话题: {{#iter_units.item.topic#}}

