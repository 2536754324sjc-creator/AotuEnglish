    - data:
        code: |
          import json
          import re


          def extract(text: str) -> dict:
              t = text.strip()
              m = re.search(r"```(?:json)?\s*(.*?)```", t, re.S)
              if m:
                  t = m.group(1).strip()
              s = t.find("{")
              e = t.rfind("}")
              if s == -1 or e == -1:
                  raise ValueError("未找到 JSON 对象")
              t = t[s:e + 1]
              try:
                  return json.loads(t)
              except json.JSONDecodeError:
                  fixed = re.sub(r",\s*([\]}])", r"\1", t)
                  return json.loads(fixed)


          def main(text: str) -> dict:
              plan = extract(text)
              course_name = plan.get("courseName") or ""
              description = plan.get("description") or ""
              units = plan.get("units")
              if not isinstance(units, list) or not units:
                  raise ValueError("缺少 units")
              clean = []
              for u in units:
                  if not isinstance(u, dict):
                      continue
                  uid = str(u.get("unitId") or "").strip()
                  if not uid:
                      raise ValueError("unit 缺少 unitId")
                  words = [str(w).strip() for w in (u.get("words") or []) if str(w).strip()]
                  dist = [str(w).strip() for w in (u.get("distractors") or []) if str(w).strip()]
                  if not words:
                      raise ValueError("unit 缺少 words: " + uid)
                  clean.append({
                      "unitId": uid,
                      "titleZh": str(u.get("titleZh") or ""),
                      "topic": str(u.get("topic") or ""),
                      "wordCount": int(u.get("wordCount") or len(words)),
                      "estMinutes": int(u.get("estMinutes") or 5),
                      "words": words,
                      "distractors": dist,
                  })
              if not clean:
                  raise ValueError("没有可用单元")
              return {"course_name": course_name, "description": description, "units": clean}

