            待审核题目: {{#parse_content.content#}}


            请先审核，再按系统指令输出审核修复结果 JSON。'
        retry_config:
          enabled: true
          exponential_backoff:
            enabled: true
            max_interval: 10000
            multiplier: 2
          max_retries: 3
          retry_interval: 2000
