<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学习地图 · AotuEnglish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+SC:wght@400;500;700;800&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-1:#f2f9ff;
    --sky-2:#dceeff;
    --ink:#12233f;
    --ink-2:#40567a;
    --ink-3:#6f86a6;
    --blue:#2f7cf6;
    --blue-strong:#1f66db;
    --blue-deep:#15479e;
    --blue-soft:#e8f2ff;
    --sun:#ffc53d;
    --sun-deep:#e7a100;
    --green:#39b96b;
    --green-deep:#228a4c;
    --green-soft:#e4f7ea;
    --white:#ffffff;
    --line:#d7e6f7;
    --shadow-sm:0 4px 0 rgba(18,35,63,.06), 0 10px 22px rgba(18,35,63,.08);
    --shadow-md:0 10px 0 rgba(18,35,63,.07), 0 22px 40px rgba(18,35,63,.12);
    --r-lg:32px;
    --r-md:24px;
    --r-sm:18px;
    --font:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    --display:"Baloo 2","Noto Sans SC",sans-serif;
    /* 中文展示体：和 Baloo 2 同为圆润性格，避免「圆数字 + 系统黑体」两种声音 */
    --round:"ZCOOL KuaiLe","Baloo 2","Noto Sans SC",sans-serif;
    --topbar:96px;
  }

  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  [hidden]{display:none !important}
  body.sheet-open{overflow:hidden}
  body{
    font-family:var(--font);
    color:var(--ink);
    background:var(--sky-1);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  button,a{font-family:inherit}
  button{cursor:pointer}
  h1,h2,p{margin:0}
  .sr-only{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
  }
  :focus-visible{outline:4px solid var(--sun);outline-offset:4px}

  .app{
    height:100dvh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background:linear-gradient(180deg,var(--sky-1) 0%,var(--sky-2) 100%);
  }

  /* ---------- top bar ---------- */
  .topbar{
    position:relative;
    z-index:20;
    height:var(--topbar);
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    padding:0 clamp(20px,4vw,56px);
    animation:bar-in .5s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes bar-in{
    from{opacity:0;transform:translateY(-10px)}
    to{opacity:1;transform:none}
  }

  .child{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
    min-height:64px;
    border:0;
    background:transparent;
    padding:6px;
    margin:-6px;
    margin-right:auto;
    border-radius:20px;
    text-align:left;
    color:var(--ink);
  }
  .avatar{
    width:54px;
    height:54px;
    flex:0 0 auto;
    border-radius:50%;
    background:#ffe0b6;
    border:3px solid var(--white);
    box-shadow:0 5px 0 rgba(18,35,63,.08);
    overflow:hidden;
    display:grid;
    place-items:center;
  }
  .avatar svg{width:100%;height:100%;display:block}
  .child-copy{display:flex;flex-direction:column;gap:3px;min-width:0}
  .child-name{
    font-family:var(--display);
    font-size:19px;
    line-height:1.1;
    font-weight:800;
    letter-spacing:.01em;
    white-space:nowrap;
  }

  .today{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 18px;
    border-radius:999px;
    background:rgba(255,255,255,.86);
    box-shadow:var(--shadow-sm);
    white-space:nowrap;
  }
  .today-label{font-size:15px;font-weight:700;color:var(--ink-2)}
  /* 今日进度用「分段填满」，和左下宝箱进度同一套语汇；星形只留给星星货币 */
  .today-segs{display:flex;align-items:center;gap:4px}
  .today-segs i{
    display:block;
    width:15px;
    height:10px;
    border-radius:5px;
    background:#dbe7f5;
  }
  .today-segs i.is-on{background:linear-gradient(90deg,var(--green),#67d28f)}
  .today-count{
    font-family:var(--display);
    font-size:19px;
    font-weight:800;
    line-height:1;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .top-actions{display:flex;align-items:center;gap:10px}
  @media (min-width:740px){
    .today{position:absolute;left:50%;transform:translateX(-50%)}
  }
  .star-count{
    display:flex;
    align-items:center;
    gap:7px;
    height:56px;
    padding:0 16px;
    border-radius:999px;
    background:var(--white);
    box-shadow:var(--shadow-sm);
    font-family:var(--display);
    font-size:21px;
    font-weight:800;
    font-variant-numeric:tabular-nums;
  }
  .star-count .icon{width:23px;height:23px;color:var(--sun)}
  .icon-btn{
    width:64px;
    height:64px;
    flex:0 0 auto;
    display:grid;
    place-items:center;
    border:0;
    border-radius:50%;
    background:var(--white);
    color:var(--ink-2);
    box-shadow:var(--shadow-sm);
    transition:transform .16s ease, box-shadow .16s ease, color .16s ease;
  }
  .icon-btn .icon{width:23px;height:23px}
  .icon-btn:hover{color:var(--blue-strong)}
  .icon-btn:active{
    transform:translateY(3px);
    box-shadow:0 1px 0 rgba(18,35,63,.06), 0 4px 10px rgba(18,35,63,.08);
  }
  .icon-btn[aria-pressed="false"]{color:var(--ink-3);background:#f4f8fd}

  /* ---------- map stage ---------- */
  .map{
    position:relative;
    flex:1 1 auto;
    min-height:0;
    overflow:hidden;
  }
  .map-canvas{
    position:absolute;
    inset:0;
    overflow:hidden;
  }
  .sky-glow{
    position:absolute;
    top:-14%;
    right:8%;
    width:min(420px,34vw);
    aspect-ratio:1;
    border-radius:50%;
    background:radial-gradient(circle,rgba(255,197,61,.55) 0%,rgba(255,197,61,0) 68%);
    pointer-events:none;
  }
  .cloud{
    position:absolute;
    color:var(--white);
    opacity:.78;
    pointer-events:none;
  }
  .cloud-a{top:8%;left:5%;width:150px}
  .cloud-b{top:18%;right:4%;width:110px;opacity:.58}
  .cloud-c{top:42%;left:2%;width:84px;opacity:.42}

  .hills{
    position:absolute;
    left:0;
    bottom:0;
    width:100%;
    height:56%;
    display:block;
    pointer-events:none;
  }
  /* 最近的一道坡：压在最前面，路和道具在这里被挡住一截，「有前后」才成立 */
  .hills-front{
    position:absolute;
    left:0;
    bottom:0;
    z-index:4;
    width:100%;
    height:120px;
    display:block;
    pointer-events:none;
  }

  .trail{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:2;
    overflow:visible;
  }
  .trail-mobile{display:none}
  .trail-base,
  .trail-done-fill,
  .trail-future-fill,
  .trail-dash{
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
    vector-effect:non-scaling-stroke;
  }
  /* 路面压出阴影：路是躺在草坡上的，不是浮在天空里的一条线 */
  .trail-base{stroke:var(--white);stroke-width:58;filter:drop-shadow(0 12px 11px rgba(18,35,63,.14))}
  .trail-done-fill{stroke:#c8e9d1;stroke-width:42}
  .trail-future-fill{stroke:#cfe3fa;stroke-width:42}
  .trail-dash{stroke:var(--white);stroke-width:5;stroke-dasharray:2 20;opacity:.95}
  .trail-base{stroke-dasharray:100;stroke-dashoffset:100;animation:draw-trail .95s .05s cubic-bezier(.3,.8,.3,1) forwards}
  .trail-done-fill{stroke-dasharray:100;stroke-dashoffset:100;animation:draw-trail .78s .12s cubic-bezier(.35,.85,.3,1) forwards}
  .trail-future-fill{opacity:0;animation:trail-in .45s .92s ease forwards}
  .trail-dash{opacity:0;animation:trail-in .4s 1s ease forwards}
  @keyframes draw-trail{to{stroke-dashoffset:0}}
  @keyframes trail-in{to{opacity:1}}

  /* ---------- trail nodes ---------- */
  .node{
    position:absolute;
    left:var(--x);
    top:var(--y);
    z-index:5;
    transform:translate(-50%,-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:11px;
    border:0;
    background:transparent;
    padding:0;
    color:var(--ink);
    animation:node-pop .5s calc(var(--i) * 145ms + 330ms) cubic-bezier(.2,.9,.3,1.25) both;
  }
  @keyframes node-pop{
    from{opacity:0;transform:translate(-50%,-50%) scale(.72)}
    to{opacity:1;transform:translate(-50%,-50%) scale(1)}
  }
  .node-badge{
    position:relative;
    width:var(--size);
    height:var(--size);
    border-radius:50%;
    display:grid;
    place-items:center;
    background:var(--white);
    border:6px solid var(--white);
    box-shadow:0 7px 0 rgba(18,35,63,.08), 0 16px 26px rgba(18,35,63,.10);
    transition:transform .16s ease, box-shadow .16s ease;
  }
  .node-badge .icon{width:calc(var(--size) * .42);height:calc(var(--size) * .42);display:block}
  .node:hover .node-badge{transform:translateY(-3px)}
  .node:active .node-badge{transform:translateY(3px);box-shadow:0 2px 0 rgba(18,35,63,.08), 0 6px 12px rgba(18,35,63,.08)}
  .node:active{transform:translate(-50%,-50%)}

  .node--done{--size:clamp(84px, 9.6vh, 100px);--i:1}
  .node--done:nth-of-type(1){--x:14%;--y:63%}
  .node--done:nth-of-type(2){--x:29%;--y:41%;--i:2}
  .node--done:nth-of-type(3){--x:45%;--y:57%;--i:3}
  .node--done .node-badge{border-color:#d4efdd;background:var(--white);color:var(--green)}
  .node--done .node-badge::after{
    content:"";
    position:absolute;
    right:-5px;
    bottom:-3px;
    width:27px;
    height:27px;
    border-radius:50%;
    background:var(--green);
    border:3px solid var(--white);
    box-shadow:0 3px 0 rgba(34,138,76,.22);
    animation:stamp-in .34s calc(var(--i) * 145ms + 520ms) cubic-bezier(.2,.9,.3,1.6) both;
  }
  .node--done .node-badge .check{
    position:absolute;
    right:1px;
    bottom:3px;
    width:16px;
    height:16px;
    color:var(--white);
    z-index:2;
    transform-origin:60% 60%;
    animation:stamp-in .34s calc(var(--i) * 145ms + 530ms) cubic-bezier(.2,.9,.3,1.6) both;
  }
  @keyframes stamp-in{
    from{transform:scale(.15) rotate(-18deg);opacity:0}
    55%{opacity:1}
    to{transform:scale(1) rotate(0);opacity:1}
  }

  .node--current{
    --size:clamp(120px, 15.6vh, 158px);
    --x:61%;
    --y:35%;
    --i:4;
    /* 大圆盘和标签之间留出光环的位置，金色圆环才是一整圈 */
    gap:24px;
    /* 当前关是全场唯一主动作，等绿路铺到脚下再落定：砸地压扁 → 回弹 */
    animation:current-drop .52s 900ms cubic-bezier(.24,.9,.28,1.12) both;
  }
  @keyframes current-drop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.62)}
    55%{opacity:1;transform:translate(-50%,-50%) scale(1.03,.93)}
    74%{transform:translate(-50%,-50%) scale(.99,1.03)}
    90%{transform:translate(-50%,-50%) scale(1.005,.995)}
    100%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  }
  .node--current .node-badge{
    border-color:var(--white);
    background:linear-gradient(180deg,#4a93ff 0%,var(--blue) 58%,#2873e9 100%);
    color:var(--white);
    box-shadow:
      0 0 0 9px rgba(255,255,255,.9),
      0 0 0 16px rgba(255,197,61,.42),
      0 13px 0 var(--blue-deep),
      0 28px 40px rgba(18,35,63,.20);
    animation:current-breathe 3.6s ease-in-out infinite;
  }
  .node--current .node-badge .icon{width:calc(var(--size) * .44);height:calc(var(--size) * .44)}
  /* 砸地那一刻，脚下荡开一圈白尘：和「盖章」是同一套手感 */
  .node--current .node-badge::before{
    content:"";
    position:absolute;
    inset:-6px;
    border-radius:50%;
    border:4px solid rgba(255,255,255,.95);
    opacity:0;
    animation:dust-ring .75s 1180ms cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes dust-ring{
    0%{opacity:.95;transform:scale(.62)}
    70%{opacity:.3}
    100%{opacity:0;transform:scale(1.36)}
  }
  @keyframes current-breathe{
    0%,100%{
      box-shadow:
        0 0 0 9px rgba(255,255,255,.9),
        0 0 0 16px rgba(255,197,61,.42),
        0 13px 0 var(--blue-deep),
        0 28px 40px rgba(18,35,63,.20);
    }
    50%{
      box-shadow:
        0 0 0 9px rgba(255,255,255,.94),
        0 0 0 21px rgba(255,197,61,.30),
        0 13px 0 var(--blue-deep),
        0 32px 46px rgba(18,35,63,.22);
    }
  }
  .node--locked{--size:clamp(74px, 8.6vh, 92px);--x:77%;--y:53%;--i:5}
  .node--locked .node-badge{
    border-color:#c3d6ec;
    background:#dbe7f6;
    color:#7d93b3;
    box-shadow:0 6px 0 #bacde3, 0 12px 20px rgba(18,35,63,.08);
  }
  .node--locked .node-badge::after{
    content:"";
    position:absolute;
    right:-4px;
    bottom:-2px;
    width:26px;
    height:26px;
    border-radius:50%;
    background:#a8bdd8;
    border:3px solid var(--white);
  }
  .node--locked .lock-mini{
    position:absolute;
    right:2px;
    bottom:4px;
    width:15px;
    height:15px;
    color:var(--white);
    z-index:2;
  }

  .node-label{
    display:inline-flex;
    align-items:center;
    gap:7px;
    min-height:38px;
    padding:7px 15px;
    border-radius:999px;
    background:rgba(255,255,255,.94);
    box-shadow:0 4px 0 rgba(18,35,63,.06);
    font-family:var(--round);
    font-size:16px;
    line-height:1.2;
    font-weight:700;
    color:var(--ink-2);
    white-space:nowrap;
  }
  /* 当前关的标签就是「开始」按钮：64px 高的金色播放键，形状上不再像一枚徽章 */
  .node--current .node-label{
    gap:12px;
    min-height:64px;
    padding:0 8px 0 20px;
    font-size:19px;
    color:var(--blue-strong);
    box-shadow:0 6px 0 rgba(18,35,63,.10), 0 16px 26px rgba(18,35,63,.10);
    margin-bottom:-26px;
  }
  .label-play{
    width:64px;
    height:64px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:var(--sun);
    color:var(--ink);
    box-shadow:0 5px 0 var(--sun-deep);
  }
  .label-play .icon{width:24px;height:24px;margin-left:3px}
  .node--done .node-label{color:var(--ink-2)}
  .node--locked .node-label{color:#5c7496;background:var(--white);box-shadow:0 4px 0 rgba(18,35,63,.08),0 0 0 2px rgba(255,255,255,.85)}

  /* 未解锁的反馈长在被点的那一关上：节点晃一下，标签就地换成一句短语，2.5 秒复原。
     不弹条、不开浮层，任何尺寸都不会盖到别的关卡。 */
  .label-denied{display:none;align-items:center;gap:6px}
  .label-denied .icon{width:15px;height:15px}
  .node--locked .node-label{transition:background .16s ease,color .16s ease,box-shadow .16s ease}
  .node--locked.is-locked-hit .node-label{
    background:var(--sun);
    color:#7a4b00;
    box-shadow:0 4px 0 var(--sun-deep);
  }
  .node--locked.is-locked-hit .label-normal{display:none}
  .node--locked.is-locked-hit .label-denied{display:inline-flex}

  .node.is-locked-hit .node-badge{animation:locked-shake .42s ease}
  @keyframes locked-shake{
    0%,100%{transform:translateX(0)}
    22%{transform:translateX(-6px) rotate(-2deg)}
    48%{transform:translateX(6px) rotate(2deg)}
    72%{transform:translateX(-3px)}
  }
  .node.is-starting .node-badge{animation:start-pulse .8s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes start-pulse{
    0%,100%{transform:scale(1)}
    28%{transform:scale(.94)}
    62%{transform:scale(1.03)}
  }
  .reward.is-bumping .reward-chest{animation:chest-bump .65s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes chest-bump{
    0%,100%{transform:translateY(0) scale(1)}
    35%{transform:translateY(-6px) scale(1.06)}
    70%{transform:translateY(1px) scale(.99)}
  }

  .flag{
    position:absolute;
    left:88%;
    top:32%;
    z-index:4;
    transform:translate(-50%,-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    opacity:.9;
    animation:node-pop .5s 1180ms cubic-bezier(.2,.9,.3,1.25) both;
    --i:6;
  }
  .flag-pole{width:5px;height:72px;border-radius:99px;background:#9db4cf}
  .flag-cloth{
    position:absolute;
    left:22px;
    top:2px;
    width:43px;
    height:30px;
    border-radius:4px 10px 10px 4px;
    background:var(--sun);
    box-shadow:0 4px 0 rgba(231,161,0,.35);
  }
  .flag-star{
    position:absolute;
    left:13px;
    top:7px;
    width:17px;
    height:17px;
    color:var(--white);
  }
  .flag-label{
    font-size:14px;
    font-weight:700;
    color:var(--ink-2);
    background:rgba(255,255,255,.8);
    border-radius:999px;
    padding:4px 9px;
    white-space:nowrap;
  }

  /* ---------- trail props（每段路的小场景） ---------- */
  .prop{
    position:absolute;
    left:var(--px);
    top:var(--py);
    width:var(--pw,56px);
    transform:translate(-50%,-50%);
    pointer-events:none;
    z-index:1;
  }
  .prop--mark{z-index:3}
  /* 小道具等路面画到附近再淡入，开场不会先飘在半空 */
  .props{animation:props-in .6s 460ms ease both}
  @keyframes props-in{from{opacity:0}to{opacity:1}}
  .prop-paint{--px:21%;--py:31%;--pw:72px}
  .prop-paws{--px:35%;--py:69%;--pw:58px}
  .prop-blocks{--px:52%;--py:21%;--pw:58px}
  .prop-tree{--px:87%;--py:66%;--pw:62px}
  .prop-bush{--px:6%;--py:80%;--pw:66px}
  .prop-mushroom{--px:33%;--py:84%;--pw:30px}
  .prop-flower{--px:58%;--py:79%;--pw:26px}
  .prop-tuft{--px:93%;--py:73%;--pw:34px}

  /* ---------- 近景（在路的前面擦过画面，制造「有前后」的空间） ---------- */
  .front{position:absolute;inset:0;z-index:6;pointer-events:none}
  .fg{position:absolute;transform:translate(-50%,-50%);display:block}
  .fg-a{left:4%;top:99%;width:108px}
  .fg-b{left:46%;top:100%;width:70px}
  .fg-c{left:98%;top:97%;width:126px}

  /* ---------- coach ---------- */
  /* 教练站在当前关的肩头，而不是悬在两个关卡中间指向空气 */
  .coach{
    position:absolute;
    left:calc(61% + 60px);
    top:calc(35% - 148px);
    z-index:6;
    display:flex;
    align-items:flex-end;
    gap:8px;
    pointer-events:none;
    animation:coach-in .55s 1150ms cubic-bezier(.2,.9,.3,1.2) both;
  }
  @keyframes coach-in{
    from{opacity:0;transform:translateY(14px) scale(.9)}
    to{opacity:1;transform:none}
  }
  .coach-star{
    width:88px;
    height:88px;
    flex:0 0 auto;
    filter:drop-shadow(0 7px 0 rgba(231,161,0,.18));
    /* 常驻 idle：安静地上下浮，画面不会在孩子等待时变成一张死图 */
    animation:coach-float 4.6s ease-in-out infinite;
  }
  @keyframes coach-float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-7px)}
  }
  .coach.is-nodding .coach-star{animation:nod .7s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes nod{
    0%,100%{transform:rotate(0) translateY(0)}
    30%{transform:rotate(-9deg) translateY(-2px)}
    65%{transform:rotate(4deg) translateY(0)}
  }
  /* ---------- reward chip ---------- */
  .reward{
    position:absolute;
    left:clamp(20px,4vw,56px);
    bottom:26px;
    z-index:12;
    display:flex;
    align-items:center;
    gap:12px;
    padding:9px 18px 9px 11px;
    border-radius:999px;
    background:rgba(255,255,255,.94);
    box-shadow:var(--shadow-sm);
    animation:bar-in .5s 1.15s both;
  }
  /* 暂停层里已经有宝箱进度，地图上的胶囊先隐去，别出现两份 */
  body.pause-open .reward{visibility:hidden}
  .reward-chest{
    width:44px;
    height:44px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:var(--sun);
    color:#7a4b00;
    box-shadow:0 4px 0 var(--sun-deep);
  }
  .reward-chest .icon{width:25px;height:25px}
  .reward-copy{display:flex;flex-direction:column;gap:6px}
  .reward-text{font-family:var(--round);font-size:15px;line-height:1.1;font-weight:700;color:var(--ink)}
  .reward-track{width:112px;height:7px;border-radius:99px;background:#e3edf9;overflow:hidden}
  .reward-track span{display:block;height:100%;width:60%;border-radius:99px;background:linear-gradient(90deg,var(--green),#67d28f)}

  /* ---------- unit sheet ---------- */
  .backdrop{
    position:fixed;
    inset:0;
    z-index:40;
    background:rgba(18,35,63,.36);
    opacity:0;
    transition:opacity .24s ease;
  }
  .backdrop.is-open{opacity:1}
  .sheet{
    position:fixed;
    left:50%;
    bottom:clamp(16px,3vh,32px);
    z-index:50;
    width:min(560px,calc(100vw - 32px));
    padding:26px 30px 30px;
    border-radius:32px;
    background:var(--white);
    box-shadow:0 30px 70px rgba(18,35,63,.28);
    opacity:0;
    transform:translate(-50%,calc(100% + 48px));
    transition:transform .34s cubic-bezier(.18,.9,.24,1.06),opacity .2s ease;
  }
  .sheet.is-open{opacity:1;transform:translate(-50%,0)}
  .sheet:focus,.pause-card:focus{outline:none}
  .sheet-close{
    position:absolute;
    top:16px;
    right:16px;
    width:64px;
    height:64px;
    display:grid;
    place-items:center;
    border:0;
    border-radius:50%;
    background:#f2f7fd;
    color:var(--ink-2);
    transition:background .16s ease,transform .16s ease;
  }
  .sheet-close:hover{background:#e8f2ff;color:var(--ink)}
  .sheet-close:active{transform:scale(.94)}
  .sheet-close .icon{width:20px;height:20px}

  .sheet-title{
    display:flex;
    align-items:baseline;
    gap:10px;
    padding-right:74px;
    font-family:var(--round);
    font-size:31px;
    line-height:1.2;
    font-weight:800;
    letter-spacing:-.01em;
  }
  .sheet-title .en{
    font-family:var(--display);
    font-size:21px;
    font-weight:700;
    color:var(--ink-3);
    letter-spacing:0;
  }
  .sheet-meta{
    margin-top:8px;
    font-size:16px;
    line-height:1.6;
    color:var(--ink-2);
  }
  .sheet-includes{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:8px 18px;
    margin-top:18px;
    font-size:16px;
    line-height:1.4;
    font-weight:700;
    color:var(--ink-2);
  }
  .sheet-includes span{display:inline-flex;align-items:center;gap:7px}
  .sheet-includes .icon{width:22px;height:22px;color:var(--blue-strong)}

  .btn{
    width:100%;
    min-height:64px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    border:0;
    border-radius:20px;
    font-family:var(--round);
    font-size:20px;
    line-height:1;
    font-weight:800;
    letter-spacing:.01em;
    transition:transform .14s ease,box-shadow .14s ease,background .16s ease;
  }
  .btn .icon{width:22px;height:22px}
  .btn-primary{
    margin-top:22px;
    background:var(--blue-strong);
    color:var(--white);
    box-shadow:0 7px 0 var(--blue-deep);
  }
  .btn-primary:hover{background:#1a5cc7}
  .btn-primary:active{transform:translateY(5px);box-shadow:0 2px 0 var(--blue-deep)}
  .btn-quiet{
    margin-top:10px;
    background:#f4f8fd;
    color:var(--ink-2);
    box-shadow:0 5px 0 #e2ecf8;
    font-size:18px;
  }
  .btn-quiet:hover{background:#eaf2ff;color:var(--ink)}
  .btn-quiet:active{transform:translateY(3px);box-shadow:0 2px 0 #e2ecf8}

  /* 三端暂停卡给同一组选项：声音开关不能只在手机出现 */
  .sound-row{
    display:flex;
    width:100%;
    min-height:64px;
    align-items:center;
    gap:12px;
    margin-top:18px;
    padding:8px 12px;
    border:0;
    border-radius:18px;
    background:#f4f9ff;
    color:var(--ink);
    text-align:left;
  }
  .sound-row-icon{
    width:42px;
    height:42px;
    flex:0 0 auto;
    display:grid;
    place-items:center;
    border-radius:13px;
    background:var(--white);
    color:var(--blue-strong);
  }
  .sound-row-icon .icon{width:22px;height:22px}
  .sound-row-copy{display:flex;flex-direction:column;gap:3px}
  .sound-row-title{font-size:16px;line-height:1.2;font-weight:700}
  .sound-row-state{font-size:13px;line-height:1.2;color:var(--ink-2)}
  .switch{
    position:relative;
    width:48px;
    height:28px;
    margin-left:auto;
    flex:0 0 auto;
    border-radius:999px;
    background:var(--blue-strong);
    transition:background .16s ease;
  }
  .switch span{
    position:absolute;
    top:3px;
    left:23px;
    width:22px;
    height:22px;
    border-radius:50%;
    background:var(--white);
    box-shadow:0 1px 3px rgba(18,35,63,.18);
    transition:left .16s ease;
  }
  .sound-row[aria-pressed="false"] .switch{background:#c9d8ea}
  .sound-row[aria-pressed="false"] .switch span{left:3px}

  /* ---------- toast ---------- */
  .toast{
    position:fixed;
    left:50%;
    bottom:104px;
    z-index:80;
    width:max-content;
    max-width:calc(100vw - 40px);
    padding:13px 20px;
    border-radius:15px;
    background:var(--white);
    color:var(--ink);
    font-size:15px;
    line-height:1.45;
    font-weight:700;
    text-align:center;
    box-shadow:0 6px 0 rgba(18,35,63,.06), 0 18px 32px rgba(18,35,63,.20);
    opacity:0;
    transform:translate(-50%,14px);
    pointer-events:none;
    transition:opacity .2s ease,transform .24s cubic-bezier(.2,.9,.3,1.1);
  }
  .toast.is-visible{opacity:1;transform:translate(-50%,0)}

  /* ---------- pause ---------- */
  .pause{
    position:fixed;
    inset:0;
    z-index:60;
    display:grid;
    place-items:center;
    padding:24px;
    background:rgba(18,35,63,.46);
    animation:fade-in .2s ease both;
  }
  @keyframes fade-in{from{opacity:0}to{opacity:1}}
  .pause-card{
    width:min(420px,100%);
    padding:34px 32px 30px;
    border-radius:32px;
    background:var(--white);
    text-align:center;
    box-shadow:0 30px 70px rgba(18,35,63,.3);
    animation:card-in .32s cubic-bezier(.2,.9,.3,1.1) both;
  }
  @keyframes card-in{
    from{opacity:0;transform:translateY(16px) scale(.96)}
    to{opacity:1;transform:none}
  }
  .pause-icon{
    width:88px;
    height:88px;
    margin:0 auto 18px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:linear-gradient(180deg,#4a93ff 0%,var(--blue) 58%,#2873e9 100%);
    color:var(--white);
    box-shadow:
      0 0 0 8px rgba(255,255,255,.92),
      0 0 0 14px rgba(255,197,61,.34),
      0 10px 0 var(--blue-deep),
      0 22px 32px rgba(18,35,63,.18);
  }
  .pause-icon .icon{width:34px;height:34px}
  .pause-card h2{font-family:var(--round);font-size:29px;line-height:1.25;font-weight:800;letter-spacing:-.01em}
  .pause-progress{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:22px;
    padding:13px 18px;
    border-radius:22px;
    background:#f4f9ff;
    text-align:left;
  }
  .pause-progress .reward-chest{width:46px;height:46px}
  .pause-progress .reward-chest .icon{width:26px;height:26px}
  .pause-progress .reward-copy{gap:7px}
  .pause-progress .reward-text{font-size:15px}
  .pause-actions{margin-top:24px}

  /* ---------- responsive ---------- */
  @media (max-width:900px){
    :root{--topbar:84px}
    .topbar{gap:12px;padding:0 20px}
    .child-name{font-size:17px}
    .today{padding:9px 14px;gap:8px}
    .today-label{font-size:14px}
    .star-count{height:52px;padding:0 13px;font-size:19px}
    .node--done{--size:clamp(76px,9.4vh,92px)}
    .node--current{--size:clamp(108px,14vh,138px)}
    .node--locked{--size:clamp(68px,8.2vh,84px)}
    .node-label{font-size:15px;min-height:35px}
    .node--current .node-label{font-size:17px;margin-bottom:-29px}
    .coach{left:calc(61% + 58px);top:calc(35% - 132px)}
    .coach-star{width:74px;height:74px}
    /* 平板宽度下大圆盘变大，123 方块得让开它的光环 */
    .prop-blocks{--px:44%;--py:14%;--pw:52px}
    .reward{left:20px;bottom:18px}
    /* 关卡介绍：面板贴底，地图留在上方压暗可见，孩子不会失去自己在哪一关的上下文 */
    .sheet{
      left:0;
      bottom:0;
      width:100%;
      max-height:86dvh;
      padding:24px 26px calc(24px + env(safe-area-inset-bottom));
      border-radius:28px 28px 0 0;
      overflow-y:auto;
      transform:translateY(100%);
    }
    .sheet.is-open{transform:translateY(0)}
    .sheet-title{font-size:29px;flex-wrap:wrap}
    .sheet .btn-primary{margin-top:26px}
  }

  @media (max-width:720px){
    :root{--topbar:132px;--map-h:calc(100dvh - 196px)}
    .app{height:100dvh;overflow:hidden}
    /* 手机顶栏分两行：上排身份与声音/暂停，下排今日五星与星星总数各站一边 */
    .topbar{
      position:sticky;
      top:0;
      z-index:30;
      display:grid;
      grid-template-columns:1fr auto;
      grid-template-rows:64px 48px;
      align-content:center;
      align-items:center;
      column-gap:12px;
      row-gap:6px;
      padding:0 14px;
      background:rgba(242,249,255,.94);
      backdrop-filter:blur(12px);
    }
    .child{grid-area:1 / 1;justify-self:start;padding:2px;margin:-2px}
    .top-actions{grid-area:1 / 2;justify-self:end;gap:8px}
    .avatar{width:60px;height:60px;border-width:3px}
    .child{gap:9px}
    .child-copy{display:flex}
    .child-name{font-size:17px}
    .today{grid-area:2 / 1;justify-self:start;padding:8px 12px;gap:8px}
    .today-label{font-size:14px}
    .today-segs{gap:3px}
    .today-segs i{width:12px;height:9px}
    .today-count{font-size:19px}
    .star-count{grid-area:2 / 2;justify-self:end;height:48px;padding:0 14px;font-size:20px;gap:6px}
    .star-count .icon{width:20px;height:20px}
    .icon-btn{width:64px;height:64px}
    /* 手机上一屏看完整条路：剩下的高度全给地图，只有极矮的屏幕才滚动 */
    .map{display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
    .map-canvas{position:relative;inset:auto;flex:1 0 auto;min-height:0}
    /* 很矮的视口（横屏手机、桌面 200% 缩放）装不下一整条路时退回滚动，宁可多滑一屏也别叠在一起 */
    @media (max-height:620px){
      .map-canvas{min-height:600px}
    }
    .hills{height:48%}
    /* 手机上终点旗就在最底下，近景坡会把它整块盖掉，这一层只在平板以上出现 */
    .hills-front{display:none}
    .cloud-a{width:104px;left:-18px;top:3%}
    .cloud-b{width:82px;right:-10px;top:13%}
    .cloud-c{display:none}
    .trail-desktop{display:none}
    .trail-mobile{display:block;inset:0;height:100%}
    .prop-paint{--px:13%;--py:32%;--pw:60px}
    .prop-paws{--px:87%;--py:50%;--pw:50px}
    /* 当前关本身就在说「123」，手机上没有干净的位置再摆一遍，收掉 */
    .prop-blocks{display:none}
    .prop-tree{--px:88%;--py:76%;--pw:52px}
    .prop-bush{--px:8%;--py:80%;--pw:58px}
    .prop-mushroom{--px:30%;--py:95%;--pw:26px}
    .prop-flower{--px:68%;--py:95%;--pw:24px}
    .prop-tuft{--px:88%;--py:91%;--pw:30px}
    .fg-a{left:5%;top:98%;width:66px}
    .fg-b{display:none}
    .fg-c{left:95%;top:97.5%;width:78px}
    /* 坐标跟着手机版路面的实际走线，尺寸跟着地图实际高度走：
       节点落在路上，矮屏按比例收，不让大圆盘压住上一关 */
    .node--done{--size:clamp(64px, calc(var(--map-h) * .115), 76px)}
    .node--done:nth-of-type(1){--x:50%;--y:7%}
    .node--done:nth-of-type(2){--x:26%;--y:22%}
    .node--done:nth-of-type(3){--x:71%;--y:37%}
    .node--current{--size:clamp(88px, calc(var(--map-h) * .173), 112px);--x:32%;--y:53%}
    .node--locked{--size:clamp(64px, calc(var(--map-h) * .109), 70px);--x:69%;--y:66%}
    .flag{left:50%;top:90%;transform:translate(-50%,-50%) scale(.86)}
    /* 教练和节点一起按地图实际高度收，矮屏上不会飘回两个关卡中间 */
    .coach{
      --cs:clamp(40px, calc(var(--map-h) * .08), 52px);
      left:calc(32% + var(--map-h) * .125 - var(--cs) / 2);
      top:calc(53% - var(--map-h) * .125 - var(--cs) / 2);
    }
    .coach-star{width:var(--cs);height:var(--cs)}
    /* 手机上奖励进度铺成一条底栏，不再压住路面和「我的家」标签 */
    .reward{
      position:sticky;
      left:auto;
      right:auto;
      bottom:0;
      z-index:30;
      justify-content:flex-start;
      padding:10px 14px calc(10px + env(safe-area-inset-bottom));
      border-radius:0;
      background:rgba(255,255,255,.97);
      box-shadow:0 -8px 22px rgba(18,35,63,.10);
    }
    .node-label{font-size:clamp(13px, calc(var(--map-h) * .0232), 15px)}
    .node--current .node-label{font-size:clamp(15px, calc(var(--map-h) * .0262), 17px)}
    /* 提示挪到顶栏正下方一行，短文案不再拆行、也不挡当前关 */
    .toast{
      top:calc(var(--topbar) + 8px);
      bottom:auto;
      width:max-content;
      max-width:calc(100vw - 28px);
      transform:translate(-50%,-10px);
    }
    .sheet{padding:20px 20px calc(22px + env(safe-area-inset-bottom))}
    .sheet-title{font-size:26px}
    .sheet-includes{gap:8px 16px;font-size:15px}
    .btn{font-size:19px}
  }

  @media (max-width:370px){
    .topbar{padding:0 10px;gap:6px}
    .today{padding:7px 10px}
    .star-count{padding:0 11px;font-size:18px}
    .avatar{width:56px;height:56px}
  }

  @media (max-width:380px){
    .sheet-includes{display:grid;gap:6px}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
      scroll-behavior:auto !important;
    }
    .node--current .node-badge{animation:none}
    .coach-star{animation:none}
  }

</style>

<script>
(function(){
  const units = {
    1: {name:'问候', en:'Hello', meta:'6 个单词 · 已完成', button:'再练一次', locked:false, icon:'#i-chat'},
    2: {name:'颜色', en:'Colors', meta:'7 个单词 · 已完成', button:'再练一次', locked:false, icon:'#i-drop'},
    3: {name:'动物', en:'Animals', meta:'9 个单词 · 已完成', button:'再练一次', locked:false, icon:'#i-paw'},
    4: {name:'数字', en:'Numbers', meta:'8 个单词 · 约 5 分钟', button:'开始第 4 关', locked:false, icon:'#i-123'},
    5: {name:'我的家', en:'My Family', meta:'8 个单词 · 未解锁', button:'尚未解锁', locked:true, icon:'#i-house'}
  };

  const backdrop = document.getElementById('backdrop');
  const sheet = document.getElementById('sheet');
  const sheetClose = document.getElementById('sheetClose');
  const sheetTitle = document.getElementById('sheetTitle');
  const sheetEn = document.getElementById('sheetEn');
  const sheetMeta = document.getElementById('sheetMeta');
  const startBtn = document.getElementById('startBtn');
  const startLabel = document.getElementById('startLabel');
  const toast = document.getElementById('toast');
  const pause = document.getElementById('pause');
  const pauseCard = pause.querySelector('.pause-card');
  const pauseBtn = document.getElementById('pauseBtn');
  const resumeBtn = document.getElementById('resumeBtn');
  const leaveBtn = document.getElementById('leaveBtn');
  const soundBtn = document.getElementById('soundBtn');
  const soundIcon = document.getElementById('soundIcon').querySelector('use');
  const childBtn = document.getElementById('childBtn');
  const coach = document.querySelector('.coach');
  const reward = document.querySelector('.reward');
  const pauseSoundBtn = document.getElementById('pauseSoundBtn');
  const pauseSoundState = document.getElementById('pauseSoundState');
  const pauseSoundIcon = document.getElementById('pauseSoundIcon').querySelector('use');

  let activeUnit = 4;
  let lastFocus = null;
  let lastPauseFocus = null;
  let toastTimer = 0;
  let startingTimer = 0;
  let lockTimer = 0;
  let holdLockNote = false;   // ?state=locked 只用于截图：把「刚点了一下」的那一帧停住
  let soundOn = true;

  function setSound(on, announce){
    soundOn = on;
    soundBtn.setAttribute('aria-pressed', String(soundOn));
    soundBtn.setAttribute('aria-label', soundOn ? '关闭声音' : '打开声音');
    soundIcon.setAttribute('href', soundOn ? '#i-sound' : '#i-mute');
    pauseSoundBtn.setAttribute('aria-pressed', String(soundOn));
    pauseSoundState.textContent = soundOn ? '已打开' : '已关闭';
    pauseSoundIcon.setAttribute('href', soundOn ? '#i-sound' : '#i-mute');
    if (announce) {
      showToast(soundOn ? '声音已打开' : '声音已关闭');
    }
  }

  function showToast(message){
    toast.textContent = message;
    toast.classList.add('is-visible');
    window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(function(){
      toast.classList.remove('is-visible');
    }, 2300);
  }

  // 只读给读屏，不弹条：未解锁的提示画在关卡自己身上
  function announce(message){
    toast.textContent = message;
  }

  function setSheetContent(id){
    const unit = units[id];
    activeUnit = id;
    sheetTitle.firstChild.nodeValue = unit.name + ' ';
    sheetEn.textContent = unit.en;
    sheetMeta.textContent = unit.meta;
    startLabel.textContent = unit.button;
    startBtn.disabled = unit.locked;
    startBtn.setAttribute('aria-disabled', String(unit.locked));
  }

  function openSheet(id){
    const unit = units[id];
    if (!unit || unit.locked) return;
    setSheetContent(id);
    lastFocus = document.activeElement;
    backdrop.hidden = false;
    sheet.hidden = false;
    document.body.classList.add('sheet-open');
    void sheet.offsetWidth;
    window.requestAnimationFrame(function(){
      backdrop.classList.add('is-open');
      sheet.classList.add('is-open');
    });
    window.setTimeout(function(){
      sheet.focus({preventScroll:true});
    }, 340);
  }

  function closeSheet(){
    if (sheet.hidden) return;
    backdrop.classList.remove('is-open');
    sheet.classList.remove('is-open');
    document.body.classList.remove('sheet-open');
    window.setTimeout(function(){
      backdrop.hidden = true;
      sheet.hidden = true;
    }, 280);
    if (lastFocus && typeof lastFocus.focus === 'function') {
      window.setTimeout(function(){
        lastFocus.focus({preventScroll:true});
      }, 300);
    }
  }

  function openPause(){
    if (!pause.hidden) return;
    lastPauseFocus = document.activeElement;
    pause.hidden = false;
    document.body.classList.add('pause-open');
    window.setTimeout(function(){ pauseCard.focus({preventScroll:true}); }, 60);
  }

  function closePause(){
    if (pause.hidden) return;
    pause.hidden = true;
    document.body.classList.remove('pause-open');
    if (lastPauseFocus && typeof lastPauseFocus.focus === 'function') {
      lastPauseFocus.focus({preventScroll:true});
    }
  }

  document.querySelectorAll('.node').forEach(function(node){
    node.addEventListener('click', function(){
      const id = Number(node.dataset.unit);
      const unit = units[id];
      if (!unit) return;
      if (unit.locked) {
        announce('先过第 4 关，才能解锁这一关');
        node.classList.remove('is-locked-hit');
        void node.offsetWidth;
        node.classList.add('is-locked-hit');
        window.clearTimeout(lockTimer);
        if (!holdLockNote) {
          lockTimer = window.setTimeout(function(){ node.classList.remove('is-locked-hit'); }, 2600);
        }
        return;
      }
      openSheet(id);
    });
  });

  sheetClose.addEventListener('click', closeSheet);
  backdrop.addEventListener('click', closeSheet);

  startBtn.addEventListener('click', function(){
    const unit = units[activeUnit];
    const node = document.querySelector('.node[data-unit="' + activeUnit + '"]');
    closeSheet();
    if (node) {
      node.classList.add('is-starting');
      window.clearTimeout(startingTimer);
      startingTimer = window.setTimeout(function(){
        node.classList.remove('is-starting');
      }, 1100);
    }
    if (coach) {
      coach.classList.add('is-nodding');
      window.setTimeout(function(){ coach.classList.remove('is-nodding'); }, 800);
    }
    if (reward) {
      reward.classList.add('is-bumping');
      window.setTimeout(function(){ reward.classList.remove('is-bumping'); }, 720);
    }
    showToast('第 ' + activeUnit + ' 关 · ' + unit.name + '，准备出发');
  });

  pauseBtn.addEventListener('click', openPause);
  resumeBtn.addEventListener('click', closePause);
  leaveBtn.addEventListener('click', closePause);

  soundBtn.addEventListener('click', function(){
    setSound(!soundOn, true);
  });
  pauseSoundBtn.addEventListener('click', function(){
    setSound(!soundOn, false);
  });

  childBtn.addEventListener('click', function(){
    showToast('Mia · 128 颗星星');
  });

  document.addEventListener('keydown', function(event){
    if (event.key === 'Escape') {
      if (!pause.hidden) { closePause(); return; }
      if (!sheet.hidden) { closeSheet(); return; }
    }
    if (event.key === 'Tab' && !sheet.hidden) {
      const focusables = [sheetClose, startBtn].filter(function(el){ return el.offsetParent !== null; });
      if (!focusables.length) return;
      const first = focusables[0];
      const last = focusables[focusables.length - 1];
      if (document.activeElement === sheet) {
        event.preventDefault();
        (event.shiftKey ? last : first).focus();
      } else if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }
    if (event.key === 'Tab' && !pause.hidden) {
      // 声音开关在桌面是隐藏的，焦点顺序得按当前真正可见的控件算
      const focusables = [pauseSoundBtn, resumeBtn, leaveBtn].filter(function(el){ return el.offsetParent !== null; });
      if (!focusables.length) return;
      const first = focusables[0];
      const last = focusables[focusables.length - 1];
      if (document.activeElement === pauseCard) {
        event.preventDefault();
        (event.shiftKey ? last : first).focus();
      } else if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }
  });

  const state = new URLSearchParams(window.location.search).get('state');
  if (state === 'sheet' || state === 'intro') {
    window.setTimeout(function(){ openSheet(4); }, 380);
  }
  if (state === 'pause') {
    window.setTimeout(openPause, 380);
  }
  if (state === 'locked') {
    holdLockNote = true;
    window.setTimeout(function(){
      const node = document.querySelector('.node[data-unit="5"]');
      if (node) node.click();
    }, 520);
  }
})();
</script>



</body>
